<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>贪吃蛇小游戏</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; font-family: 'Microsoft YaHei','PingFang SC',sans-serif;
            color: #fff; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none;
        }
        .game-container { text-align: center; padding: 10px; width: 100%; max-width: 500px; }
        h1 { font-size: 2.5rem; margin-bottom: 10px; text-shadow: 0 0 20px rgba(0,255,136,.5); color: #00ff88; }
        .info-bar { display: flex; justify-content: space-between; align-items: center; max-width: 400px; margin: 0 auto 10px; padding: 0 5px; }
        .score { font-size: 1.3rem; color: #ffd700; text-shadow: 0 0 10px rgba(255,215,0,.5); }
        .high-score { font-size: 1rem; color: #ff6b6b; }
        canvas { border: 3px solid #00ff88; border-radius: 8px; box-shadow: 0 0 30px rgba(0,255,136,.3),inset 0 0 30px rgba(0,0,0,.3); background: #1a1a2e; display: block; margin: 0 auto; max-width: 100%; }
        .controls { margin-top: 15px; font-size: .9rem; color: #aaa; }
        .controls span { background: rgba(255,255,255,.1); padding: 3px 10px; border-radius: 5px; margin: 0 3px; border: 1px solid rgba(255,255,255,.2); }
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(0,0,0,.7); border-radius: 8px; opacity: 0; pointer-events: none; transition: opacity .3s; }
        .overlay.show { opacity: 1; pointer-events: all; }
        .overlay h2 { font-size: 2rem; color: #ff6b6b; margin-bottom: 10px; }
        .overlay p { font-size: 1.1rem; margin-bottom: 20px; color: #ddd; }
        .btn { padding: 10px 30px; font-size: 1.1rem; border: 2px solid #00ff88; background: transparent; color: #00ff88; border-radius: 25px; cursor: pointer; transition: all .3s; font-family: inherit; }
        .btn:hover, .btn:active { background: #00ff88; color: #1a1a2e; box-shadow: 0 0 20px rgba(0,255,136,.5); }
        .canvas-wrapper { position: relative; display: inline-block; max-width: 100%; }

        /* 皮肤选择器 */
        .skin-selector { display: flex; gap: 8px; margin-bottom: 12px; justify-content: center; flex-wrap: wrap; max-width: 420px; margin-left: auto; margin-right: auto; }
        .skin-btn { width: 36px; height: 36px; border-radius: 50%; border: 2px solid rgba(255,255,255,.2); cursor: pointer; transition: all .3s; position: relative; overflow: hidden; }
        .skin-btn:hover { transform: scale(1.2); }
        .skin-btn.active { border-color: #fff; box-shadow: 0 0 12px rgba(255,255,255,.6); transform: scale(1.1); }
        .skin-btn .skin-name { position: absolute; bottom: -20px; left: 50%; transform: translateX(-50%); font-size: .6rem; white-space: nowrap; color: #aaa; opacity: 0; transition: opacity .2s; pointer-events: none; background: rgba(0,0,0,.7); padding: 2px 4px; border-radius: 3px; }
        .skin-btn:hover .skin-name { opacity: 1; }

        /* 难度选择器 */
        .difficulty-selector { display: flex; gap: 8px; margin-bottom: 15px; justify-content: center; align-items: center; max-width: 420px; margin-left: auto; margin-right: auto; }
        .difficulty-label { color: #aaa; font-size: .9rem; margin-right: 5px; }
        .diff-btn { padding: 6px 16px; font-size: .85rem; border: 1px solid rgba(255,255,255,.2); background: rgba(255,255,255,.05); color: #ccc; border-radius: 20px; cursor: pointer; transition: all .3s; font-family: inherit; }
        .diff-btn:hover { background: rgba(255,255,255,.1); }
        .diff-btn.active { background: #00ff88; color: #1a1a2e; border-color: #00ff88; box-shadow: 0 0 10px rgba(0,255,136,.4); }

        .mobile-controls { display: none; margin-top: 15px; user-select: none; }
        .mobile-controls .row { display: flex; justify-content: center; gap: 8px; margin: 5px 0; }
        .mobile-btn { width: 70px; height: 70px; font-size: 1.8rem; border: 2px solid #00ff88; background: rgba(0,255,136,.1); color: #00ff88; border-radius: 15px; cursor: pointer; display: flex; justify-content: center; align-items: center; transition: all .15s; }
        .mobile-btn:active { background: #00ff88; color: #1a1a2e; }
        .pause-btn { position: absolute; top: 10px; right: 10px; width: 40px; height: 40px; background: rgba(255,255,255,.1); border: 2px solid #00ff88; border-radius: 50%; color: #00ff88; font-size: 1.2rem; cursor: pointer; z-index: 10; }
        .swipe-hint { display: none; margin-top: 10px; color: #00ff88; font-size: .85rem; opacity: .8; }

        @media (max-width: 500px) { h1{font-size:1.8rem} .mobile-controls{display:block} .controls{display:none} .swipe-hint{display:block} .mobile-btn{width:65px;height:65px} }
        @media (max-width: 350px) { .mobile-btn{width:55px;height:55px;font-size:1.4rem} }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🐍 贪吃蛇</h1>
        <div class="skin-selector" id="skinSelector"></div>
        <div class="difficulty-selector">
            <span class="difficulty-label">难度:</span>
            <button class="diff-btn active" data-diff="easy">简单</button>
            <button class="diff-btn" data-diff="normal">中等</button>
            <button class="diff-btn" data-diff="hard">困难</button>
        </div>
        <div class="info-bar">
            <div class="score">分数: <span id="score">0</span></div>
            <div class="high-score">最高分: <span id="highScore">0</span></div>
        </div>
        <div class="canvas-wrapper">
            <button class="pause-btn" id="pauseBtn">⏸</button>
            <canvas id="gameCanvas" width="400" height="400"></canvas>
            <div class="overlay show" id="startScreen">
                <h2>🐍 贪吃蛇</h2>
                <p>选择皮肤和难度，滑动或按键控制方向</p>
                <button class="btn" id="startBtn">开始游戏</button>
            </div>
            <div class="overlay" id="gameOverScreen">
                <h2>游戏结束!</h2>
                <p>最终得分: <span id="finalScore">0</span></p>
                <button class="btn" id="restartBtn">重新开始</button>
            </div>
        </div>
        <div class="controls">
            <span>↑</span> <span>↓</span> <span>←</span> <span>→</span> 或
            <span>W</span> <span>A</span> <span>S</span> <span>D</span> 控制方向
            &nbsp;|&nbsp; <span>P</span> 暂停
        </div>
        <div class="swipe-hint">💡 在游戏区域滑动手指可控制方向</div>
        <div class="mobile-controls">
            <div class="row"><button class="mobile-btn" data-dir="up">↑</button></div>
            <div class="row">
                <button class="mobile-btn" data-dir="left">←</button>
                <button class="mobile-btn" data-dir="down">↓</button>
                <button class="mobile-btn" data-dir="right">→</button>
            </div>
        </div>
    </div>

    <script>
        // ============ 皮肤系统 ============
        const SKINS = {
            default: {
                name: '经典',
                gradient: ['#00ff88', '#00cc6a', '#009950'],
                headColor: '#00ff88',
                eyeColor: '#fff',
                headGlow: '#00ff88',
                getBodyColor: (i, len) => {
                    const ratio = i / len;
                    const r = Math.floor(0 + ratio * 10);
                    const g = Math.floor(255 - ratio * 80);
                    const b = Math.floor(136 - ratio * 60);
                    return `rgb(${r},${g},${b})`;
                },
                preview: 'linear-gradient(135deg, #00ff88, #009950)'
            },
            sunset: {
                name: '日落',
                gradient: ['#ff6b6b', '#ff8e53', '#ffd93d'],
                headColor: '#ff6b6b',
                eyeColor: '#fff',
                headGlow: '#ff6b6b',
                getBodyColor: (i, len) => {
                    const ratio = i / len;
                    if (ratio < 0.33) return '#ff6b6b';
                    if (ratio < 0.66) return '#ff8e53';
                    return '#ffd93d';
                },
                preview: 'linear-gradient(135deg, #ff6b6b, #ffd93d)'
            },
            ocean: {
                name: '海洋',
                gradient: ['#00d2ff', '#3a7bd5', '#0052d4'],
                headColor: '#00d2ff',
                eyeColor: '#fff',
                headGlow: '#00d2ff',
                getBodyColor: (i, len) => {
                    const ratio = i / len;
                    const r = Math.floor(0 + ratio * 20);
                    const g = Math.floor(210 - ratio * 100);
                    const b = Math.floor(255 - ratio * 50);
                    return `rgb(${r},${g},${b})`;
                },
                preview: 'linear-gradient(135deg, #00d2ff, #0052d4)'
            },
            forest: {
                name: '森林',
                gradient: ['#56ab2f', '#a8e063', '#4caf50'],
                headColor: '#a8e063',
                eyeColor: '#000',
                headGlow: '#a8e063',
                getBodyColor: (i, len) => {
                    const ratio = i / len;
                    if (i % 3 === 0) return '#56ab2f';
                    if (i % 3 === 1) return '#4caf50';
                    return '#388e3c';
                },
                preview: 'linear-gradient(135deg, #56ab2f, #4caf50)'
            },
            purple: {
                name: '幻紫',
                gradient: ['#9c27b0', '#ce93d8', '#e91e63'],
                headColor: '#ce93d8',
                eyeColor: '#fff',
                headGlow: '#ce93d8',
                getBodyColor: (i, len) => {
                    const ratio = i / len;
                    const r = Math.floor(156 + ratio * 50);
                    const g = Math.floor(39 - ratio * 20);
                    const b = Math.floor(176 + ratio * 50);
                    return `rgb(${r},${g},${b})`;
                },
                preview: 'linear-gradient(135deg, #9c27b0, #e91e63)'
            },
            candy: {
                name: '糖果',
                gradient: ['#f953c6', '#b91d73', '#ff6f91'],
                headColor: '#f953c6',
                eyeColor: '#fff',
                headGlow: '#f953c6',
                getBodyColor: (i, len) => {
                    const ratio = i / len;
                    if (i % 4 < 2) return '#f953c6';
                    return '#ff6f91';
                },
                preview: 'linear-gradient(135deg, #f953c6, #ff6f91)'
            },
            cyber: {
                name: '赛博',
                gradient: ['#00fff5', '#00b8d4', '#6200ea'],
                headColor: '#00fff5',
                eyeColor: '#000',
                headGlow: '#00fff5',
                getBodyColor: (i, len) => {
                    const ratio = i / len;
                    if (i % 5 < 2) return '#00fff5';
                    if (i % 5 < 4) return '#00b8d4';
                    return '#6200ea';
                },
                preview: 'linear-gradient(135deg, #00fff5, #6200ea)'
            },
            fire: {
                name: '烈焰',
                gradient: ['#ff0844', '#ffb199', '#ff0000'],
                headColor: '#ff0844',
                eyeColor: '#fff',
                headGlow: '#ff4444',
                getBodyColor: (i, len) => {
                    const ratio = i / len;
                    const r = 255;
                    const g = Math.floor(8 + (1 - ratio) * 100);
                    const b = Math.floor(68 - ratio * 50);
                    return `rgb(${r},${g},${b})`;
                },
                preview: 'linear-gradient(135deg, #ff0844, #ff8800)'
            },
            ice: {
                name: '冰霜',
                gradient: ['#e0f7fa', '#80deea', '#4dd0e1'],
                headColor: '#80deea',
                eyeColor: '#000',
                headGlow: '#80deea',
                getBodyColor: (i, len) => {
                    const ratio = i / len;
                    const r = Math.floor(128 + ratio * 100);
                    const g = Math.floor(222 - ratio * 50);
                    const b = Math.floor(234 - ratio * 30);
                    return `rgb(${r},${g},${b})`;
                },
                preview: 'linear-gradient(135deg, #e0f7fa, #4dd0e1)'
            },
            gold: {
                name: '黄金',
                gradient: ['#ffd700', '#ffb347', '#ff8c00'],
                headColor: '#ffd700',
                eyeColor: '#000',
                headGlow: '#ffd700',
                getBodyColor: (i, len) => {
                    const ratio = i / len;
                    const r = 255;
                    const g = Math.floor(215 - ratio * 80);
                    const b = Math.floor(0 + ratio * 20);
                    return `rgb(${r},${g},${b})`;
                },
                preview: 'linear-gradient(135deg, #ffd700, #ff8c00)'
            },
            rainbow: {
                name: '彩虹',
                gradient: ['#ff0000', '#ff7700', '#ffff00', '#00ff00', '#0000ff', '#8b00ff'],
                headColor: '#fff',
                eyeColor: '#000',
                headGlow: '#fff',
                getBodyColor: (i, len, time = Date.now()) => {
                    const hue = ((i * 30) + (time / 20)) % 360;
                    return `hsl(${hue}, 90%, 55%)`;
                },
                preview: 'linear-gradient(90deg, #ff0000, #ff7700, #ffff00, #00ff00, #0000ff, #8b00ff)',
                animated: true
            },
            matrix: {
                name: '矩阵',
                gradient: ['#00ff41', '#008f11', '#003b00'],
                headColor: '#00ff41',
                eyeColor: '#000',
                headGlow: '#00ff41',
                getBodyColor: (i, len) => {
                    const ratio = i / len;
                    const brightness = Math.floor(255 - ratio * 200);
                    return `rgb(0,${brightness},0)`;
                },
                preview: 'linear-gradient(135deg, #00ff41, #003b00)'
            }
        };

        // ============ 难度配置 ============
        const DIFFICULTIES = {
            easy: { name: '简单', initialSpeed: 180, speedIncrement: 1, minSpeed: 80, specialFoodChance: 0.4 },
            normal: { name: '中等', initialSpeed: 130, speedIncrement: 2, minSpeed: 55, specialFoodChance: 0.3 },
            hard: { name: '困难', initialSpeed: 80, speedIncrement: 3, minSpeed: 35, specialFoodChance: 0.2 }
        };

        let currentSkin = 'default';
        let currentDifficulty = 'easy';
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // 皮肤选择器初始化
        function initSkinSelector() {
            const container = document.getElementById('skinSelector');
            container.innerHTML = '';
            for (const [key, skin] of Object.entries(SKINS)) {
                const btn = document.createElement('div');
                btn.className = 'skin-btn' + (key === currentSkin ? ' active' : '');
                btn.dataset.skin = key;
                btn.style.background = skin.preview;
                btn.innerHTML = `<span class="skin-name">${skin.name}</span>`;
                btn.addEventListener('click', () => {
                    currentSkin = key;
                    document.querySelectorAll('.skin-btn').forEach(x => x.classList.toggle('active', x.dataset.skin === key));
                    draw();
                });
                container.appendChild(btn);
            }
        }

        // 难度选择器初始化
        function initDifficultySelector() {
            document.querySelectorAll('.diff-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    currentDifficulty = btn.dataset.diff;
                    document.querySelectorAll('.diff-btn').forEach(x => x.classList.toggle('active', x.dataset.diff === currentDifficulty));
                    if (isRunning) {
                        const diff = DIFFICULTIES[currentDifficulty];
                        speed = diff.initialSpeed;
                        restartLoop();
                    }
                });
            });
        }

        initSkinSelector();
        initDifficultySelector();

        // ============ 游戏配置 ============
        const CONFIG = { gridSize: 20, gridCount: 20 };

        let snake = [], food = null, direction = {x:1,y:0}, nextDirection = {x:1,y:0};
        let score = 0, highScore = parseInt(localStorage.getItem('snakeHighScore')) || 0;
        let gameLoop = null, speed = 150, isRunning = false, isPaused = false;
        let specialFood = null, specialFoodTimer = 0;

        const scoreEl = document.getElementById('score'), highScoreEl = document.getElementById('highScore'), finalScoreEl = document.getElementById('finalScore');
        const startScreen = document.getElementById('startScreen'), gameOverScreen = document.getElementById('gameOverScreen');
        const startBtn = document.getElementById('startBtn'), restartBtn = document.getElementById('restartBtn'), pauseBtn = document.getElementById('pauseBtn');
        highScoreEl.textContent = highScore;

        function resizeCanvas() { const m = Math.min(400, window.innerWidth - 30); canvas.style.width = m + 'px'; canvas.style.height = m + 'px'; }
        resizeCanvas(); window.addEventListener('resize', resizeCanvas);

        function initGame() {
            const diff = DIFFICULTIES[currentDifficulty];
            const mid = Math.floor(CONFIG.gridCount / 2);
            snake = [{x:mid,y:mid},{x:mid-1,y:mid},{x:mid-2,y:mid}];
            direction = {x:1,y:0}; nextDirection = {x:1,y:0}; score = 0; speed = diff.initialSpeed;
            isPaused = false; specialFood = null; specialFoodTimer = 0;
            scoreEl.textContent = '0'; pauseBtn.textContent = '⏸'; spawnFood();
        }

        function getEmptyCells() {
            const occupied = new Set();
            snake.forEach(s => occupied.add(`${s.x},${s.y}`));
            if (food) occupied.add(`${food.x},${food.y}`);
            if (specialFood) occupied.add(`${specialFood.x},${specialFood.y}`);
            const empty = [];
            for (let x = 0; x < CONFIG.gridCount; x++) {
                for (let y = 0; y < CONFIG.gridCount; y++) {
                    if (!occupied.has(`${x},${y}`)) empty.push({x, y});
                }
            }
            return empty;
        }

        function spawnFood() {
            const empty = getEmptyCells();
            if (empty.length === 0) return;
            food = empty[Math.floor(Math.random() * empty.length)];
        }

        function spawnSpecialFood() {
            const empty = getEmptyCells();
            if (empty.length === 0) return;
            specialFood = empty[Math.floor(Math.random() * empty.length)];
            specialFoodTimer = 50;
        }

        function update() {
            if (isPaused) return;
            direction = {...nextDirection};
            const head = {x: snake[0].x + direction.x, y: snake[0].y + direction.y};
            
            if (head.x < 0 || head.x >= CONFIG.gridCount || head.y < 0 || head.y >= CONFIG.gridCount) {
                gameOver();
                return;
            }
            
            for (let i = 0; i < snake.length; i++) {
                if (snake[i].x === head.x && snake[i].y === head.y) {
                    gameOver();
                    return;
                }
            }
            
            snake.unshift(head);
            const diff = DIFFICULTIES[currentDifficulty];
            
            if (food && head.x === food.x && head.y === food.y) {
                score += 10;
                scoreEl.textContent = score;
                spawnFood();
                speed = Math.max(diff.minSpeed, speed - diff.speedIncrement);
                restartLoop();
                if (!specialFood && Math.random() < diff.specialFoodChance) {
                    spawnSpecialFood();
                }
            } else if (specialFood && head.x === specialFood.x && head.y === specialFood.y) {
                score += 50;
                scoreEl.textContent = score;
                specialFood = null;
                specialFoodTimer = 0;
            } else {
                snake.pop();
            }
            
            if (specialFood) {
                specialFoodTimer--;
                if (specialFoodTimer <= 0) specialFood = null;
            }
        }

        function draw() {
            const t = Date.now();
            const skin = SKINS[currentSkin];
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 绘制网格
            ctx.strokeStyle = 'rgba(255,255,255,.03)';
            ctx.lineWidth = .5;
            for (let i = 0; i <= CONFIG.gridCount; i++) {
                ctx.beginPath();
                ctx.moveTo(i * CONFIG.gridSize, 0);
                ctx.lineTo(i * CONFIG.gridSize, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * CONFIG.gridSize);
                ctx.lineTo(canvas.width, i * CONFIG.gridSize);
                ctx.stroke();
            }
            
            // 绘制蛇身
            snake.forEach((seg, idx) => {
                const x = seg.x * CONFIG.gridSize;
                const y = seg.y * CONFIG.gridSize;
                const size = CONFIG.gridSize - 2;
                const offset = 1;
                
                if (idx === 0) {
                    // 蛇头
                    ctx.shadowColor = skin.headGlow;
                    ctx.shadowBlur = 15;
                    ctx.fillStyle = skin.headColor;
                    roundRect(ctx, x + offset, y + offset, size, size, 6);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    
                    // 眼睛
                    drawEyes(x, y, skin.eyeColor);
                } else {
                    // 蛇身
                    ctx.fillStyle = skin.animated ? skin.getBodyColor(idx, snake.length, t) : skin.getBodyColor(idx, snake.length);
                    ctx.shadowBlur = 0;
                    roundRect(ctx, x + offset, y + offset, size, size, 4);
                    ctx.fill();
                }
            });
            
            // 绘制普通食物
            if (food) {
                const fx = food.x * CONFIG.gridSize + CONFIG.gridSize / 2;
                const fy = food.y * CONFIG.gridSize + CONFIG.gridSize / 2;
                const radius = CONFIG.gridSize / 2 - 2;
                
                ctx.shadowColor = '#ff4757';
                ctx.shadowBlur = 15;
                ctx.fillStyle = '#ff4757';
                ctx.beginPath();
                ctx.arc(fx, fy, radius, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.fillStyle = 'rgba(255,255,255,.4)';
                ctx.beginPath();
                ctx.arc(fx - 3, fy - 3, radius / 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            }
            
            // 绘制特殊食物
            if (specialFood) {
                const sx = specialFood.x * CONFIG.gridSize + CONFIG.gridSize / 2;
                const sy = specialFood.y * CONFIG.gridSize + CONFIG.gridSize / 2;
                const alpha = .5 + .5 * Math.sin(t / 100);
                
                ctx.shadowColor = '#ffd700';
                ctx.shadowBlur = 20;
                ctx.fillStyle = `rgba(255,215,0,${alpha})`;
                drawStar(ctx, sx, sy, 5, CONFIG.gridSize / 2 - 1, CONFIG.gridSize / 4);
                ctx.fill();
                ctx.shadowBlur = 0;
                
                ctx.fillStyle = `rgba(255,215,0,${alpha})`;
                ctx.font = 'bold 10px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('+50', sx, sy - CONFIG.gridSize / 2 - 3);
            }
            
            // 暂停提示
            if (isPaused) {
                ctx.fillStyle = 'rgba(0,0,0,.5)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#00ff88';
                ctx.font = 'bold 30px Microsoft YaHei';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('暂停中', canvas.width / 2, canvas.height / 2);
                ctx.font = '16px Microsoft YaHei';
                ctx.fillStyle = '#aaa';
                ctx.fillText('点击 ⏸ 继续', canvas.width / 2, canvas.height / 2 + 35);
            }
        }

        function drawEyes(x, y, eyeColor) {
            const s = CONFIG.gridSize;
            let e1x, e1y, e2x, e2y;
            
            if (direction.x === 1) {
                e1x = x + s * .7; e1y = y + s * .3;
                e2x = x + s * .7; e2y = y + s * .7;
            } else if (direction.x === -1) {
                e1x = x + s * .3; e1y = y + s * .3;
                e2x = x + s * .3; e2y = y + s * .7;
            } else if (direction.y === -1) {
                e1x = x + s * .3; e1y = y + s * .3;
                e2x = x + s * .7; e2y = y + s * .3;
            } else {
                e1x = x + s * .3; e1y = y + s * .7;
                e2x = x + s * .7; e2y = y + s * .7;
            }
            
            ctx.fillStyle = eyeColor;
            ctx.beginPath();
            ctx.arc(e1x, e1y, 2.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(e2x, e2y, 2.5, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(e1x + direction.x, e1y + direction.y, 1.2, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(e2x + direction.x, e2y + direction.y, 1.2, 0, Math.PI * 2);
            ctx.fill();
        }

        function roundRect(ctx, x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.arcTo(x + w, y, x + w, y + h, r);
            ctx.arcTo(x + w, y + h, x, y + h, r);
            ctx.arcTo(x, y + h, x, y, r);
            ctx.arcTo(x, y, x + w, y, r);
            ctx.closePath();
        }

        function drawStar(ctx, cx, cy, spikes, outerRadius, innerRadius) {
            let rot = Math.PI / 2 * 3;
            let step = Math.PI / spikes;
            ctx.beginPath();
            ctx.moveTo(cx, cy - outerRadius);
            for (let i = 0; i < spikes; i++) {
                ctx.lineTo(cx + Math.cos(rot) * outerRadius, cy + Math.sin(rot) * outerRadius);
                rot += step;
                ctx.lineTo(cx + Math.cos(rot) * innerRadius, cy + Math.sin(rot) * innerRadius);
                rot += step;
            }
            ctx.lineTo(cx, cy - outerRadius);
            ctx.closePath();
        }

        function restartLoop() {
            if (gameLoop) clearInterval(gameLoop);
            gameLoop = setInterval(() => {
                update();
                draw();
                if (SKINS[currentSkin].animated) draw(); // 动画皮肤重绘
            }, speed);
        }

        function startGame() {
            initGame();
            startScreen.classList.remove('show');
            gameOverScreen.classList.remove('show');
            isRunning = true;
            restartLoop();
            draw();
        }

        function gameOver() {
            isRunning = false;
            clearInterval(gameLoop);
            gameLoop = null;
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('snakeHighScore', highScore);
                highScoreEl.textContent = highScore;
            }
            finalScoreEl.textContent = score;
            gameOverScreen.classList.add('show');
        }

        function togglePause() {
            if (!isRunning) return;
            isPaused = !isPaused;
            pauseBtn.textContent = isPaused ? '▶' : '⏸';
            if (!isPaused) draw();
        }

        // 键盘控制
        document.addEventListener('keydown', e => {
            if (!isRunning) return;
            switch (e.key) {
                case 'ArrowUp': case 'w': case 'W':
                    if (direction.y !== 1) nextDirection = {x:0, y:-1};
                    e.preventDefault();
                    break;
                case 'ArrowDown': case 's': case 'S':
                    if (direction.y !== -1) nextDirection = {x:0, y:1};
                    e.preventDefault();
                    break;
                case 'ArrowLeft': case 'a': case 'A':
                    if (direction.x !== 1) nextDirection = {x:-1, y:0};
                    e.preventDefault();
                    break;
                case 'ArrowRight': case 'd': case 'D':
                    if (direction.x !== -1) nextDirection = {x:1, y:0};
                    e.preventDefault();
                    break;
                case 'p': case 'P':
                    togglePause();
                    break;
            }
        });

        // 触摸控制
        let touchStartX = 0, touchStartY = 0, touchStartTime = 0;
        
        canvas.addEventListener('touchstart', e => {
            e.preventDefault();
            const touch = e.touches[0];
            touchStartX = touch.clientX;
            touchStartY = touch.clientY;
            touchStartTime = Date.now();
        }, {passive: false});
        
        canvas.addEventListener('touchmove', e => {
            e.preventDefault();
        }, {passive: false});
        
        canvas.addEventListener('touchend', e => {
            e.preventDefault();
            if (!isRunning || isPaused) return;
            const touch = e.changedTouches[0];
            const dx = touch.clientX - touchStartX;
            const dy = touch.clientY - touchStartY;
            const dt = Date.now() - touchStartTime;
            
            if (dt > 500) return;
            if (Math.abs(dx) < 20 && Math.abs(dy) < 20) {
                togglePause();
                return;
            }
            
            if (Math.abs(dx) > Math.abs(dy)) {
                if (dx > 0 && direction.x !== -1) nextDirection = {x:1, y:0};
                else if (dx < 0 && direction.x !== 1) nextDirection = {x:-1, y:0};
            } else {
                if (dy > 0 && direction.y !== -1) nextDirection = {x:0, y:1};
                else if (dy < 0 && direction.y !== 1) nextDirection = {x:0, y:-1};
            }
        }, {passive: false});

        // 移动端按钮控制
        document.querySelectorAll('.mobile-btn').forEach(btn => {
            btn.addEventListener('touchstart', e => {
                e.preventDefault();
                if (!isRunning) return;
                const dir = btn.dataset.dir;
                switch (dir) {
                    case 'up': if (direction.y !== 1) nextDirection = {x:0, y:-1}; break;
                    case 'down': if (direction.y !== -1) nextDirection = {x:0, y:1}; break;
                    case 'left': if (direction.x !== 1) nextDirection = {x:-1, y:0}; break;
                    case 'right': if (direction.x !== -1) nextDirection = {x:1, y:0}; break;
                }
            });
        });

        // 按钮事件
        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);
        pauseBtn.addEventListener('click', togglePause);
        document.addEventListener('dblclick', e => e.preventDefault());
        
        initGame();
        draw();
    </script>
</body>
</html>
