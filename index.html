<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>贪吃蛇小游戏</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; font-family: 'Microsoft YaHei','PingFang SC',sans-serif;
            color: #fff; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none;
        }
        .game-container { text-align: center; padding: 10px; width: 100%; max-width: 500px; }
        h1 { font-size: 2.5rem; margin-bottom: 10px; text-shadow: 0 0 20px rgba(0,255,136,.5); color: #00ff88; }
        .info-bar { display: flex; justify-content: space-between; align-items: center; max-width: 400px; margin: 0 auto 10px; padding: 0 5px; }
        .score { font-size: 1.3rem; color: #ffd700; text-shadow: 0 0 10px rgba(255,215,0,.5); }
        .high-score { font-size: 1rem; color: #ff6b6b; }
        canvas { border: 3px solid #00ff88; border-radius: 8px; box-shadow: 0 0 30px rgba(0,255,136,.3),inset 0 0 30px rgba(0,0,0,.3); background: #1a1a2e; display: block; margin: 0 auto; max-width: 100%; }
        .controls { margin-top: 15px; font-size: .9rem; color: #aaa; }
        .controls span { background: rgba(255,255,255,.1); padding: 3px 10px; border-radius: 5px; margin: 0 3px; border: 1px solid rgba(255,255,255,.2); }
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(0,0,0,.7); border-radius: 8px; opacity: 0; pointer-events: none; transition: opacity .3s; }
        .overlay.show { opacity: 1; pointer-events: all; }
        .overlay h2 { font-size: 2rem; color: #ff6b6b; margin-bottom: 10px; }
        .overlay p { font-size: 1.1rem; margin-bottom: 20px; color: #ddd; }
        .btn { padding: 10px 30px; font-size: 1.1rem; border: 2px solid #00ff88; background: transparent; color: #00ff88; border-radius: 25px; cursor: pointer; transition: all .3s; font-family: inherit; }
        .btn:hover, .btn:active { background: #00ff88; color: #1a1a2e; box-shadow: 0 0 20px rgba(0,255,136,.5); }
        .canvas-wrapper { position: relative; display: inline-block; max-width: 100%; }

        /* 皮肤选择器 */
        .skin-selector { display: flex; gap: 6px; margin-bottom: 10px; justify-content: center; flex-wrap: wrap; max-width: 400px; margin-left: auto; margin-right: auto; }
        .skin-btn { width: 32px; height: 32px; border-radius: 50%; border: 2px solid rgba(255,255,255,.2); cursor: pointer; transition: all .3s; position: relative; }
        .skin-btn:hover { transform: scale(1.15); }
        .skin-btn.active { border-color: #fff; box-shadow: 0 0 10px rgba(255,255,255,.5); }
        .skin-btn .skin-name { position: absolute; bottom: -18px; left: 50%; transform: translateX(-50%); font-size: .55rem; white-space: nowrap; color: #aaa; opacity: 0; transition: opacity .2s; pointer-events: none; }
        .skin-btn:hover .skin-name { opacity: 1; }

        .mobile-controls { display: none; margin-top: 15px; user-select: none; }
        .mobile-controls .row { display: flex; justify-content: center; gap: 8px; margin: 5px 0; }
        .mobile-btn { width: 70px; height: 70px; font-size: 1.8rem; border: 2px solid #00ff88; background: rgba(0,255,136,.1); color: #00ff88; border-radius: 15px; cursor: pointer; display: flex; justify-content: center; align-items: center; transition: all .15s; }
        .mobile-btn:active { background: #00ff88; color: #1a1a2e; }
        .pause-btn { position: absolute; top: 10px; right: 10px; width: 40px; height: 40px; background: rgba(255,255,255,.1); border: 2px solid #00ff88; border-radius: 50%; color: #00ff88; font-size: 1.2rem; cursor: pointer; z-index: 10; }
        .swipe-hint { display: none; margin-top: 10px; color: #00ff88; font-size: .85rem; opacity: .8; }

        @media (max-width: 500px) { h1{font-size:1.8rem} .mobile-controls{display:block} .controls{display:none} .swipe-hint{display:block} .mobile-btn{width:65px;height:65px} }
        @media (max-width: 350px) { .mobile-btn{width:55px;height:55px;font-size:1.4rem} }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🐍 贪吃蛇</h1>
        <div class="skin-selector" id="skinSelector"></div>
        <div class="info-bar">
            <div class="score">分数: <span id="score">0</span></div>
            <div class="high-score">最高分: <span id="highScore">0</span></div>
        </div>
        <div class="canvas-wrapper">
            <button class="pause-btn" id="pauseBtn">⏸</button>
            <canvas id="gameCanvas" width="400" height="400"></canvas>
            <div class="overlay show" id="startScreen">
                <h2>🐍 贪吃蛇</h2>
                <p>选择皮肤，滑动或按键控制方向</p>
                <button class="btn" id="startBtn">开始游戏</button>
            </div>
            <div class="overlay" id="gameOverScreen">
                <h2>游戏结束!</h2>
                <p>最终得分: <span id="finalScore">0</span></p>
                <button class="btn" id="restartBtn">重新开始</button>
            </div>
        </div>
        <div class="controls">
            <span>↑</span> <span>↓</span> <span>←</span> <span>→</span> 或
            <span>W</span> <span>A</span> <span>S</span> <span>D</span> 控制方向
            &nbsp;|&nbsp; <span>P</span> 暂停
        </div>
        <div class="swipe-hint">💡 在游戏区域滑动手指可控制方向</div>
        <div class="mobile-controls">
            <div class="row"><button class="mobile-btn" data-dir="up">↑</button></div>
            <div class="row">
                <button class="mobile-btn" data-dir="left">←</button>
                <button class="mobile-btn" data-dir="down">↓</button>
                <button class="mobile-btn" data-dir="right">→</button>
            </div>
        </div>
    </div>

    <script>
        // ============ 皮肤系统 ============
        const SKINS = {
            default: {
                name: '默认', headColor: '#00ff88', headGlow: '#00ff88',
                bodyColor: (i, len, t) => { const g=Math.floor(255-(i/len)*100),b=Math.floor(136-(i/len)*80); return `rgb(0,${g},${b})`; },
                btnStyle: 'background:#00ff88;'
            },
            ironman: {
                name: '钢铁侠', headColor: '#ff0000', headGlow: '#ff0000',
                bodyColor: (i, len, t) => { const r=i/len; if(i%4<2)return `rgb(${220-r*80},${20+(1-r)*60},20)`; return `rgb(${255-r*60},${215-r*60},0)`; },
                btnStyle: 'background:linear-gradient(135deg,#ff0000,#ffd700);'
            },
            xiuluo: {
                name: '修罗铠甲', headColor: '#8b0000', headGlow: '#ff0000',
                bodyColor: (i, len, t) => { const r=i/len,p=Math.sin(t/300+i*.5)*.3+.7; return `rgb(${Math.floor((180-r*80)*p)},${Math.floor((20-r*10)*p)},${Math.floor((30-r*15)*p)})`; },
                btnStyle: 'background:linear-gradient(135deg,#8b0000,#1a1a1a);'
            },
            xingtian: {
                name: '刑天铠甲', headColor: '#0066cc', headGlow: '#00aaff',
                bodyColor: (i, len, t) => { const r=i/len; if(i%5<3)return `rgb(0,${Math.floor(100-r*50)},${Math.floor(200-r*80)})`; return `rgb(${Math.floor(192-r*40)},${Math.floor(192-r*40)},${Math.floor(192-r*40)})`; },
                btnStyle: 'background:linear-gradient(135deg,#0066cc,#c0c0c0);'
            },
            dihuang: {
                name: '帝皇铠甲', headColor: '#9932cc', headGlow: '#cc66ff',
                bodyColor: (i, len, t) => { const r=i/len,hue=270+(i*8)%60,l=45+Math.sin(t/400+i*.3)*10; return `hsl(${hue},${80-r*20}%,${l}%)`; },
                btnStyle: 'background:linear-gradient(135deg,#9932cc,#ffd700);'
            },
            rainbow: {
                name: '彩虹', headColor: '#ff00ff', headGlow: '#ff00ff',
                bodyColor: (i, len, t) => `hsl(${(i*15+t/20)%360},85%,55%)`,
                btnStyle: 'background:linear-gradient(90deg,#ff0000,#ff7700,#ffff00,#00ff00,#0000ff,#8b00ff);'
            },
            neon: {
                name: '霓虹', headColor: '#ff00ff', headGlow: '#00ffff',
                bodyColor: (i, len, t) => { const p=Math.sin(t/200+i*.8)*.5+.5; if(i%2===0)return `rgba(255,0,${Math.floor(255*p)},${.7+.3*p})`; return `rgba(0,${Math.floor(255*p)},255,${.7+.3*p})`; },
                btnStyle: 'background:linear-gradient(135deg,#ff00ff,#00ffff);'
            },
            ice: {
                name: '冰霜', headColor: '#00bfff', headGlow: '#88eeff',
                bodyColor: (i, len, t) => { const r=i/len,s=Math.sin(t/300+i*1.2)*.15; return `rgb(${Math.min(255,Math.floor(180+s*255-r*80))},${Math.min(255,Math.floor(220+s*255-r*60))},${Math.floor(255-r*30)})`; },
                btnStyle: 'background:linear-gradient(135deg,#00bfff,#e0f0ff);'
            },
            fire: {
                name: '火焰', headColor: '#ff4500', headGlow: '#ff6600',
                bodyColor: (i, len, t) => { const r=i/len,f=Math.sin(t/100+i*2)*.2+.8; return `rgb(${Math.floor((255-r*100)*f)},${Math.floor((80+(1-r)*100)*f*.6)},0)`; },
                btnStyle: 'background:linear-gradient(135deg,#ff4500,#ff8c00);'
            },
            dark: {
                name: '暗黑', headColor: '#8000ff', headGlow: '#aa44ff',
                bodyColor: (i, len, t) => { const r=i/len,p=Math.sin(t/500+i*.4)*.15+.85; return `rgb(${Math.floor((80-r*40)*p)},${Math.floor((10+(1-r)*20)*p)},${Math.floor((130-r*50)*p)})`; },
                btnStyle: 'background:linear-gradient(135deg,#4a0080,#8000ff);'
            },
            pixel: {
                name: '像素', headColor: '#00ff00', headGlow: '#00ff00',
                bodyColor: (i) => i%3===0?'#00cc00':i%3===1?'#009900':'#006600',
                btnStyle: 'background:#00ff00;'
            },
            gold: {
                name: '金色', headColor: '#ffd700', headGlow: '#ffee44',
                bodyColor: (i, len, t) => { const r=i/len,s=Math.sin(t/250+i*.6)*.15+.85; return `rgb(${Math.floor((255-r*60)*s)},${Math.floor((215-r*80)*s)},${Math.floor(r*40)})`; },
                btnStyle: 'background:linear-gradient(135deg,#ffd700,#ffaa00);'
            }
        };

        let currentSkin = 'default';
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // 皮肤选择器初始化
        function initSkinSelector() {
            const c = document.getElementById('skinSelector');
            for (const [k, s] of Object.entries(SKINS)) {
                const b = document.createElement('div');
                b.className = 'skin-btn' + (k === currentSkin ? ' active' : '');
                b.dataset.skin = k;
                b.style.cssText = s.btnStyle;
                b.innerHTML = `<span class="skin-name">${s.name}</span>`;
                b.addEventListener('click', () => { currentSkin = k; document.querySelectorAll('.skin-btn').forEach(x => x.classList.toggle('active', x.dataset.skin === k)); });
                c.appendChild(b);
            }
        }
        initSkinSelector();

        // ============ 游戏配置 ============
        const CONFIG = { gridSize: 20, gridCount: 20, initialSpeed: 150, speedIncrement: 2, minSpeed: 60 };

        let snake = [], food = null, direction = {x:1,y:0}, nextDirection = {x:1,y:0};
        let score = 0, highScore = parseInt(localStorage.getItem('snakeHighScore')) || 0;
        let gameLoop = null, speed = CONFIG.initialSpeed, isRunning = false, isPaused = false;
        let specialFood = null, specialFoodTimer = 0;

        const scoreEl = document.getElementById('score'), highScoreEl = document.getElementById('highScore'), finalScoreEl = document.getElementById('finalScore');
        const startScreen = document.getElementById('startScreen'), gameOverScreen = document.getElementById('gameOverScreen');
        const startBtn = document.getElementById('startBtn'), restartBtn = document.getElementById('restartBtn'), pauseBtn = document.getElementById('pauseBtn');
        highScoreEl.textContent = highScore;

        function resizeCanvas() { const m = Math.min(400, window.innerWidth - 30); canvas.style.width = m + 'px'; canvas.style.height = m + 'px'; }
        resizeCanvas(); window.addEventListener('resize', resizeCanvas);

        function initGame() {
            const mid = Math.floor(CONFIG.gridCount / 2);
            snake = [{x:mid,y:mid},{x:mid-1,y:mid},{x:mid-2,y:mid}];
            direction = {x:1,y:0}; nextDirection = {x:1,y:0}; score = 0; speed = CONFIG.initialSpeed;
            isPaused = false; specialFood = null; specialFoodTimer = 0;
            scoreEl.textContent = '0'; pauseBtn.textContent = '⏸'; spawnFood();
        }

        function getEmptyCells() {
            const o = new Set(); snake.forEach(s => o.add(`${s.x},${s.y}`));
            if (food) o.add(`${food.x},${food.y}`); if (specialFood) o.add(`${specialFood.x},${specialFood.y}`);
            const e = []; for (let x = 0; x < CONFIG.gridCount; x++) for (let y = 0; y < CONFIG.gridCount; y++) if (!o.has(`${x},${y}`)) e.push({x,y}); return e;
        }
        function spawnFood() { const e = getEmptyCells(); if (e.length === 0) return; food = e[Math.floor(Math.random() * e.length)]; }
        function spawnSpecialFood() { const e = getEmptyCells(); if (e.length === 0) return; specialFood = e[Math.floor(Math.random() * e.length)]; specialFoodTimer = 50; }

        function update() {
            if (isPaused) return;
            direction = {...nextDirection};
            const head = {x: snake[0].x + direction.x, y: snake[0].y + direction.y};
            if (head.x < 0 || head.x >= CONFIG.gridCount || head.y < 0 || head.y >= CONFIG.gridCount) { gameOver(); return; }
            for (let i = 0; i < snake.length; i++) if (snake[i].x === head.x && snake[i].y === head.y) { gameOver(); return; }
            snake.unshift(head);
            if (food && head.x === food.x && head.y === food.y) {
                score += 10; scoreEl.textContent = score; spawnFood();
                speed = Math.max(CONFIG.minSpeed, speed - CONFIG.speedIncrement); restartLoop();
                if (!specialFood && Math.random() < 0.3) spawnSpecialFood();
            } else if (specialFood && head.x === specialFood.x && head.y === specialFood.y) {
                score += 50; scoreEl.textContent = score; specialFood = null; specialFoodTimer = 0;
            } else { snake.pop(); }
            if (specialFood) { specialFoodTimer--; if (specialFoodTimer <= 0) specialFood = null; }
        }

        function draw() {
            const t = Date.now();
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = 'rgba(255,255,255,.03)'; ctx.lineWidth = .5;
            for (let i = 0; i <= CONFIG.gridCount; i++) {
                ctx.beginPath(); ctx.moveTo(i*CONFIG.gridSize,0); ctx.lineTo(i*CONFIG.gridSize,canvas.height); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0,i*CONFIG.gridSize); ctx.lineTo(canvas.width,i*CONFIG.gridSize); ctx.stroke();
            }
            const skin = SKINS[currentSkin];
            snake.forEach((seg, idx) => {
                const x = seg.x * CONFIG.gridSize, y = seg.y * CONFIG.gridSize, sz = CONFIG.gridSize - 2, off = 1;
                if (idx === 0) {
                    const grd = ctx.createRadialGradient(x+CONFIG.gridSize/2,y+CONFIG.gridSize/2,2,x+CONFIG.gridSize/2,y+CONFIG.gridSize/2,CONFIG.gridSize/2);
                    grd.addColorStop(0, skin.headColor); grd.addColorStop(1, skin.headColor);
                    ctx.fillStyle = grd; ctx.shadowColor = skin.headGlow; ctx.shadowBlur = 10;
                    roundRect(ctx,x+off,y+off,sz,sz,5); ctx.fill(); ctx.shadowBlur = 0;
                    drawEyes(x,y);
                } else {
                    ctx.fillStyle = skin.bodyColor(idx, snake.length, t); ctx.shadowBlur = 0;
                    roundRect(ctx,x+off,y+off,sz,sz,4); ctx.fill();
                }
            });
            if (food) {
                const fx = food.x*CONFIG.gridSize+CONFIG.gridSize/2, fy = food.y*CONFIG.gridSize+CONFIG.gridSize/2, r = CONFIG.gridSize/2-2;
                ctx.shadowColor = '#ff4757'; ctx.shadowBlur = 15; ctx.fillStyle = '#ff4757';
                ctx.beginPath(); ctx.arc(fx,fy,r,0,Math.PI*2); ctx.fill();
                ctx.fillStyle = 'rgba(255,255,255,.4)'; ctx.beginPath(); ctx.arc(fx-3,fy-3,r/3,0,Math.PI*2); ctx.fill(); ctx.shadowBlur = 0;
            }
            if (specialFood) {
                const sx = specialFood.x*CONFIG.gridSize+CONFIG.gridSize/2, sy = specialFood.y*CONFIG.gridSize+CONFIG.gridSize/2, a = .5+.5*Math.sin(t/100);
                ctx.shadowColor = '#ffd700'; ctx.shadowBlur = 20; ctx.fillStyle = `rgba(255,215,0,${a})`;
                drawStar(ctx,sx,sy,5,CONFIG.gridSize/2-1,CONFIG.gridSize/4); ctx.fill(); ctx.shadowBlur = 0;
                ctx.fillStyle = `rgba(255,215,0,${a})`; ctx.font = 'bold 10px sans-serif'; ctx.textAlign = 'center';
                ctx.fillText('+50', sx, sy - CONFIG.gridSize/2 - 3);
            }
            if (isPaused) {
                ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(0,0,canvas.width,canvas.height);
                ctx.fillStyle = '#00ff88'; ctx.font = 'bold 30px Microsoft YaHei'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText('暂停中', canvas.width/2, canvas.height/2);
                ctx.font = '16px Microsoft YaHei'; ctx.fillStyle = '#aaa';
                ctx.fillText('点击 ⏸ 继续', canvas.width/2, canvas.height/2 + 35);
            }
        }

        function drawEyes(x,y) {
            const s = CONFIG.gridSize; let e1x,e1y,e2x,e2y;
            if(direction.x===1){e1x=x+s*.7;e1y=y+s*.3;e2x=x+s*.7;e2y=y+s*.7;}
            else if(direction.x===-1){e1x=x+s*.3;e1y=y+s*.3;e2x=x+s*.3;e2y=y+s*.7;}
            else if(direction.y===-1){e1x=x+s*.3;e1y=y+s*.3;e2x=x+s*.7;e2y=y+s*.3;}
            else{e1x=x+s*.3;e1y=y+s*.7;e2x=x+s*.7;e2y=y+s*.7;}
            ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(e1x,e1y,2.5,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(e2x,e2y,2.5,0,Math.PI*2);ctx.fill();
            ctx.fillStyle='#000';ctx.beginPath();ctx.arc(e1x+direction.x,e1y+direction.y,1.2,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(e2x+direction.x,e2y+direction.y,1.2,0,Math.PI*2);ctx.fill();
        }
        function roundRect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
        function drawStar(c,cx,cy,sp,oR,iR){let rot=Math.PI/2*3,st=Math.PI/sp;c.beginPath();c.moveTo(cx,cy-oR);for(let i=0;i<sp;i++){c.lineTo(cx+Math.cos(rot)*oR,cy+Math.sin(rot)*oR);rot+=st;c.lineTo(cx+Math.cos(rot)*iR,cy+Math.sin(rot)*iR);rot+=st;}c.lineTo(cx,cy-oR);c.closePath();}

        function restartLoop(){if(gameLoop)clearInterval(gameLoop);gameLoop=setInterval(()=>{update();draw();},speed);}
        function startGame(){initGame();startScreen.classList.remove('show');gameOverScreen.classList.remove('show');isRunning=true;restartLoop();draw();}
        function gameOver(){isRunning=false;clearInterval(gameLoop);gameLoop=null;if(score>highScore){highScore=score;localStorage.setItem('snakeHighScore',highScore);highScoreEl.textContent=highScore;}finalScoreEl.textContent=score;gameOverScreen.classList.add('show');}
        function togglePause(){if(!isRunning)return;isPaused=!isPaused;pauseBtn.textContent=isPaused?'▶':'⏸';if(!isPaused)draw();}

        document.addEventListener('keydown',e=>{
            if(!isRunning)return;
            switch(e.key){
                case'ArrowUp':case'w':case'W':if(direction.y!==1)nextDirection={x:0,y:-1};e.preventDefault();break;
                case'ArrowDown':case's':case'S':if(direction.y!==-1)nextDirection={x:0,y:1};e.preventDefault();break;
                case'ArrowLeft':case'a':case'A':if(direction.x!==1)nextDirection={x:-1,y:0};e.preventDefault();break;
                case'ArrowRight':case'd':case'D':if(direction.x!==-1)nextDirection={x:1,y:0};e.preventDefault();break;
                case'p':case'P':togglePause();break;
            }
        });

        let touchStartX=0,touchStartY=0,touchStartTime=0;
        canvas.addEventListener('touchstart',e=>{e.preventDefault();const t=e.touches[0];touchStartX=t.clientX;touchStartY=t.clientY;touchStartTime=Date.now();},{passive:false});
        canvas.addEventListener('touchmove',e=>{e.preventDefault();},{passive:false});
        canvas.addEventListener('touchend',e=>{e.preventDefault();if(!isRunning||isPaused)return;const t=e.changedTouches[0],dx=t.clientX-touchStartX,dy=t.clientY-touchStartY,dt=Date.now()-touchStartTime;if(dt>500)return;if(Math.abs(dx)<20&&Math.abs(dy)<20){togglePause();return;}if(Math.abs(dx)>Math.abs(dy)){if(dx>0&&direction.x!==-1)nextDirection={x:1,y:0};else if(dx<0&&direction.x!==1)nextDirection={x:-1,y:0};}else{if(dy>0&&direction.y!==-1)nextDirection={x:0,y:1};else if(dy<0&&direction.y!==1)nextDirection={x:0,y:-1};}},{passive:false});

        document.querySelectorAll('.mobile-btn').forEach(b=>{b.addEventListener('touchstart',e=>{e.preventDefault();if(!isRunning)return;const d=b.dataset.dir;switch(d){case'up':if(direction.y!==1)nextDirection={x:0,y:-1};break;case'down':if(direction.y!==-1)nextDirection={x:0,y:1};break;case'left':if(direction.x!==1)nextDirection={x:-1,y:0};break;case'right':if(direction.x!==-1)nextDirection={x:1,y:0};break;}});});

        startBtn.addEventListener('click',startGame);
        restartBtn.addEventListener('click',startGame);
        pauseBtn.addEventListener('click',togglePause);
        document.addEventListener('dblclick',e=>e.preventDefault());
        initGame();draw();
    </script>
</body>
</html>
